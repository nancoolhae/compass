    const position = Math.max(0, Math.min(4, relative + 2));
    const left = Math.floor(position);
    const right = Math.min(4, left + 1);
    const [x, y, angle, scale] = poses[left].map((value, axis) =>

function drawInk() {

  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = palette[active].color;

    const [[x, y]] = points;

    if (points.length === 1) {

  const width = Math.max(...xs) - x, height = Math.max(...ys) - y;
  const size = Math.max(width, height, 34) + 12;
  svg.setAttribute('viewBox', `${x + (width - size) / 2} ${y + (height - size) / 2} ${size} ${size}`);
  for (const stroke of entry.strokes) {
    const shape = document.createElementNS(svgNS, stroke.length === 1 ? 'circle' : 'polyline');
    if (stroke.length === 1) {
      shape.setAttribute('cx', stroke[0][0]);
      shape.setAttribute('cy', stroke[0][1]);
      shape.setAttribute('r', 3.5);
      shape.setAttribute('fill', 'currentColor');
    } else {
      shape.setAttribute('points', stroke.map(pair => pair.join(',')).join(' '));
      shape.setAttribute('fill', 'none');
      shape.setAttribute('stroke', 'currentColor');
      shape.setAttribute('stroke-width', '7');
      shape.setAttribute('stroke-linecap', 'round');
      shape.setAttribute('stroke-linejoin', 'round');
    }
    svg.append(shape);
  }
  const caption = document.createElement('figcaption');
  caption.textContent = `${entry.name}’s 반딧불`;
  figure.append(svg, caption);
  rendered.set(entry.sequence, figure);
}

function sortGallery() {
  let next = gallery.firstElementChild;
  for (const [, figure] of [...rendered.entries()].sort((a, b) => b[0] - a[0])) {
    if (figure === next) next = next.nextElementSibling;
    else gallery.insertBefore(figure, next);
  }
}

async function loadGallery(older = false) {
  if (galleryRequest) return;
  const request = new AbortController();
  galleryRequest = request;
  more.disabled = true;
  const query = new URLSearchParams();
  if (selectedFilter !== null) query.set('emotion', selectedFilter);
  if (older) query.set('before', oldest);
  else if (initialized) query.set('after', newest);
  const timeout = setTimeout(() => request.abort(), 10000);
  try {
    const response = await fetch(`${pagesBackend}/api/fireflies?${query}`, { signal: request.signal });
    if (!response.ok) throw new Error('Gallery request failed');
    const { entries, hasMore } = await response.json();
    if (galleryRequest !== request) return;
    if (!initialized || older) {
      oldest = entries.at(-1)?.sequence ?? oldest;
      more.hidden = !hasMore;
    }
    const before = rendered.size;
    for (const entry of entries) {
      newest = Math.max(newest, entry.sequence);
      showFirefly(entry);
    }
    if (rendered.size !== before) sortGallery();
    initialized = true;
    const emptySelection = selectedFilter !== null && rendered.size === 0;
    if (emptySelection) forestStatus.textContent = '이 감정의 반딧불은 아직 없어요.';
    forestStatus.hidden = !emptySelection;
  } catch {
    if (galleryRequest !== request) return;
    forestStatus.textContent = '반딧불을 불러오는 중이에요. 잠시 후 다시 연결합니다.';
    forestStatus.hidden = false;
  } finally {
    clearTimeout(timeout);
    if (galleryRequest === request) {
      galleryRequest = undefined;
      more.disabled = false;
    }
  }
}
function refreshForest() { return loadGallery(); }
more.onclick = () => loadGallery(true);

let forestDrag;
scroller.addEventListener('pointerdown', event => {
  if (!wide.matches || event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('button')) return;
  forestDrag = { id: event.pointerId, x: event.clientX, scroll: scroller.scrollLeft };
  scroller.setPointerCapture(event.pointerId);
  scroller.classList.add('dragging');
});
scroller.addEventListener('pointermove', event => {
  if (forestDrag?.id === event.pointerId) scroller.scrollLeft = forestDrag.scroll + forestDrag.x - event.clientX;
});
for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  scroller.addEventListener(event, () => {
    forestDrag = null;
    scroller.classList.remove('dragging');
  });
}
scroller.addEventListener('wheel', event => {
  if (!wide.matches || Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;
  event.preventDefault();
  const multiplier = [1, 16, scroller.clientWidth][event.deltaMode] ?? 1;
  scroller.scrollLeft += event.deltaY * multiplier;
}, { passive: false });

renderRoute();

</script>

      <div id="carousel" tabindex="0" role="group" aria-roledescription="카드 목록" aria-label="감정 카드. 드래그하거나 왼쪽과 오른쪽 방향키로 이동">
